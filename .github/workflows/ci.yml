name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests (incl. PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -v

  dag-integrity:
    name: Airflow DAG import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow with official constraints
        run: |
          pip install "apache-airflow==2.10.3" apache-airflow-providers-common-sql \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-3.12.txt
      - name: DAGs load without errors and have the expected tasks
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          airflow db migrate > /dev/null
          python - <<'PY'
          from airflow.models import DagBag
          bag = DagBag(dag_folder="dags", include_examples=False)
          assert not bag.import_errors, bag.import_errors
          dag = bag.get_dag("bvb_daily_prices")
          assert {t.task_id for t in dag.tasks} == {"extract_and_validate", "build_indicators", "marts_freshness_check"}
          print("DAG OK:", dag.dag_id, dag.schedule_interval)
          PY

  airflow-image:
    name: Build Airflow image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.airflow
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
