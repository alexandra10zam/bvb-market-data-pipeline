[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bvb-pipeline"
version = "1.0.0"
description = "Daily ELT pipeline for Bucharest Stock Exchange prices: extract, data-quality checks, indicators, PostgreSQL marts"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "testcontainers[postgres]>=4.8"]

[project.scripts]
bvb-pipeline = "bvb_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bvb_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (Testcontainers PostgreSQL)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
